name: rules

# Checks each pull request against the shared rules, through the actions of zadykian/toolkit with
# their default inputs: its commits and size, its description, and the banned terms. Each warns
# and never blocks, so no ruleset requires it. Each action's README says what it checks:
# https://github.com/zadykian/toolkit/tree/main/actions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Two runs of a pull request race to create each check's comment, so a newer event's run cancels
# the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/toolkit/actions/atomic-commits@381d7507e88bdfdca05830ba7486eecfa9b7d1ca # v7.1.0
      - uses: zadykian/toolkit/actions/pr-description@381d7507e88bdfdca05830ba7486eecfa9b7d1ca # v7.1.0
      - uses: zadykian/toolkit/actions/banned-terms@381d7507e88bdfdca05830ba7486eecfa9b7d1ca # v7.1.0

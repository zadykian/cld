name: rules

# Checks each pull request against the shared rules, through the actions of zadykian/toolkit with
# their default inputs: its commits and size, its description, and the banned terms. Each warns
# and never blocks, so no ruleset requires it. Each action's README says what it checks:
# https://github.com/zadykian/toolkit/tree/main/actions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/toolkit/actions/atomic-commits@4c0c6dcb16a67dd4ab7346a8214e93c076dd1402 # v4.0.0
      - uses: zadykian/toolkit/actions/pr-description@4c0c6dcb16a67dd4ab7346a8214e93c076dd1402 # v4.0.0
      - uses: zadykian/toolkit/actions/banned-terms@4c0c6dcb16a67dd4ab7346a8214e93c076dd1402 # v4.0.0

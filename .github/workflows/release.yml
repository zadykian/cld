name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docker-check

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A binary per platform, cld-OS-ARCH, and cld.sha256 listing them; a build that fails for
      # any platform fails the job before anything is published. The runner is linux/amd64.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make dist VERSION="${TAG#v}"
          test "$(dist/cld-linux-amd64 --version)" = "cld ${TAG#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/cld-* dist/cld.sha256 --title "$TAG" --generate-notes

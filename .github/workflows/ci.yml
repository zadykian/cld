name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (tmux ${{ matrix.tmux }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The same image as `make docker-check`: the base image's tmux, or a release built from source.
      matrix:
        include:
          - { tmux: 3.3a, base: "debian:bookworm" } # the oldest cld supports
          - { tmux: 3.4, base: "ubuntu:24.04" }
          - { tmux: 3.5a, base: "debian:trixie" }
          - { tmux: 3.7c, base: "debian:trixie", build: "3.7c" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built from layers cached per tmux version: installing the packages and the JDK takes about
      # a minute, and has taken ten on Ubuntu's archive.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            TMUX_VERSION=${{ matrix.build }}
          tags: cld-test:ci
          load: true
          cache-from: type=gha,scope=tmux-${{ matrix.tmux }}
          cache-to: type=gha,scope=tmux-${{ matrix.tmux }},mode=max
      - run: make docker-test IMAGE=cld-test:ci

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: brew install tmux shellcheck shfmt
      # The latest tmux from Homebrew, and cld built for macOS, on its ptys.
      - run: tmux -V && make check

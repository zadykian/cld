name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same image as `make docker-check`, with the Dockerfile's defaults: the pinned tmux release,
  # built from source. The job's name carries no version, so that bumping it leaves the ruleset's
  # required checks as they are.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built from cached layers: installing the packages and the JDK takes about a minute, and
      # building tmux a little less.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          tags: cld-test:ci
          load: true
          cache-from: type=gha,scope=linux
          cache-to: type=gha,scope=linux,mode=max
      - run: make docker-test IMAGE=cld-test:ci

  # The same checks on the oldest tmux cld runs on, raised with its minimum
  # (docs/design/decisions/0006-versions.md), as `make docker-check TMUX_VERSION=3.5a` runs them.
  # Advisory: the ruleset does not require it.
  linux-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          build-args: |
            TMUX_VERSION=3.5a
          tags: cld-test:oldest
          load: true
          cache-from: type=gha,scope=linux-oldest
          cache-to: type=gha,scope=linux-oldest,mode=max
      - run: make docker-test IMAGE=cld-test:oldest

  # The completion tests in bash with ble.sh, as `make docker-blesh-check` runs them: the same
  # Dockerfile, built on Ubuntu with its package ble.sh, as `make docker-blesh-image` builds it.
  blesh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          build-args: |
            BASE=ubuntu:26.04
            PACKAGES=ble.sh
          tags: cld-test:blesh
          load: true
          cache-from: type=gha,scope=blesh
          cache-to: type=gha,scope=blesh,mode=max
      - run: make docker-blesh-test BLESH_IMAGE=cld-test:blesh

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: brew install tmux shellcheck shfmt
      # The latest tmux from Homebrew, and cld built for macOS, on its ptys.
      - run: tmux -V && make check

  # Every gate of `make lint`, with the tools it pins (tools/run): the checks `make check` runs
  # besides the tests, golangci-lint, the size caps, Vale, govulncheck, actionlint, zizmor and
  # lychee.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
        env:
          # zizmor's online audits, which look the actions up on GitHub, need a token.
          GH_TOKEN: ${{ github.token }}

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # tmux 3.3a (the oldest cld supports), 3.4, 3.5a; the same image as `make docker-check`.
        base: [debian:bookworm, ubuntu:24.04, debian:trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docker-check BASE=${{ matrix.base }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: brew install tmux shellcheck shfmt
      # The latest tmux from Homebrew, and cld under macOS's own bash 3.2.
      - run: tmux -V && make check
        env:
          CLD_BASH: /bin/bash

# Weekly updates of cld's Go modules and of the actions the workflows pin, each release a week
# old at least. Dependabot cannot see the tools that tools/run pins: they are bumped by hand. So
# is go.mod's toolchain line, when govulncheck reports its Go release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The bindings move by hand, with the Ghostty commit tests/ghostty/deps.txt pins
    # (docs/design/decisions/0054-ghostty.md).
    ignore:
      - dependency-name: go.mitchellh.com/libghostty
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The toolkit's actions move by hand, with the marketplace's ref in .claude/settings.json,
    # which Dependabot does not read: the toolkit's tools/pin moves both to one release.
    ignore:
      - dependency-name: zadykian/toolkit*
